<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=520">
<title>数字じゃんけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
:root{--desk:#25303f;--paper:#fbf8ef;--rule:#a9cbe8;--margin:#e48b8b;--pencil:#f0be25;--ink:#33322f;--ok:#2f7d5b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--desk);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;display:flex;justify-content:center;padding:18px}
.pad{width:100%;max-width:520px;background:var(--paper);border-radius:6px 6px 14px 14px;padding:26px 22px 26px 54px;position:relative;box-shadow:0 12px 30px #0006;
 background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 36px;background-position:0 30px;min-height:80vh}
.pad::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:var(--margin)}
h1{font-family:"Klee One",cursive;font-size:30px;margin:0 0 4px;line-height:36px}
p.sub{margin:0 0 18px;line-height:36px;font-size:14px}
label{display:block;font-size:13px;line-height:24px}
input[type=text]{width:100%;font:600 20px "Klee One",cursive;padding:6px 10px;border:2px solid var(--ink);border-radius:4px;background:#fffdf6;margin-bottom:12px}
button{font:700 16px "Zen Kaku Gothic New",sans-serif;padding:10px 18px;border:2px solid var(--ink);background:var(--pencil);color:var(--ink);border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin:4px 8px 4px 0}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.ghost{background:#fffdf6}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
.hide{display:none!important}
.code{font:600 44px "Klee One",cursive;letter-spacing:.18em;line-height:54px}
ul.names{list-style:none;padding:0;margin:8px 0}
ul.names li{font:600 20px/36px "Klee One",cursive}
.msg{color:#b3261e;min-height:24px;font-size:14px}
.big{font:600 96px/1 "Klee One",cursive;text-align:center;margin:8px 0}
.num-in{width:100%;font:600 56px "Klee One",cursive;text-align:center;padding:4px;border:2px solid var(--ink);border-radius:4px;background:#fffdf6}
input[type=range]{width:100%;margin:12px 0}
.bar{height:8px;background:#0001;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--margin);transform-origin:left}
/* notepad rows */
.row{display:flex;align-items:baseline;justify-content:space-between;line-height:36px;font:600 22px/36px "Klee One",cursive}
.row .n{position:relative;display:inline-block;min-width:3.2ch;text-align:right;clip-path:inset(-10px 100% -10px 0)}
.row .n.write{animation:write .9s steps(14,end) forwards}
.row .n .pen{position:absolute;right:-6px;top:-4px;font-size:22px;opacity:0;transform-origin:bottom left;transform:rotate(-10deg)}
.row .n.write .pen{animation:pen .9s linear forwards}
@keyframes write{to{clip-path:inset(-10px -30px -10px 0)}}
@keyframes pen{0%{opacity:1;right:100%}90%{opacity:1}100%{opacity:0;right:-6px}}
.calc{font:600 26px/36px "Klee One",cursive;text-align:center;margin:14px 0;opacity:0;transform:scale(.8)}
.calc.show{animation:pop .5s ease-out forwards}
.calc small{display:block;font:500 14px "Zen Kaku Gothic New",sans-serif}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.rank{display:flex;gap:10px;align-items:baseline;font:600 22px/36px "Klee One",cursive;opacity:0}
.rank.show{animation:pop .4s ease-out forwards}
.rank b{width:3.4em;color:var(--margin)}.rank.tie b::after{content:"(あいこ)";font-size:11px;color:var(--ink)}
.rank.first b{color:var(--ok)}.rank.me{background:#f0be2544}
.scoreline{display:block;font:500 12px/20px "Zen Kaku Gothic New",sans-serif;margin-top:-4px;opacity:.8}
#banner{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--ink);color:var(--paper);padding:8px 12px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:14px}
#banner button{margin:0;padding:3px 10px;font-size:13px;box-shadow:none}
/* overlay */
#ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
.ring{width:240px;height:240px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:#0002}.ring .fg{stroke:var(--margin);stroke-dasharray:691.2;stroke-dashoffset:691.2}
.ring.go .fg{animation:ring 3s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.ring span{font:600 34px "Klee One",cursive}
@media (prefers-reduced-motion:reduce){.row .n.write,.ring.go .fg{animation-duration:.01s}.row .n .pen{display:none}}
@media (pointer:coarse){
  .chat{margin:12px 0 4px;padding:9px 9px 8px}
  .chat h2{font-size:16px;margin-bottom:6px}
  .chat-log{height:120px;padding:5px}
  .chat-empty{font-size:12px;padding:14px 3px}
  .chat-msg{margin:4px 0;font-size:13px;line-height:18px}
  .chat-form{gap:5px;margin-top:6px}
  .chat-form input{font-size:13px!important;padding:6px 7px!important}
  .chat-form button{padding:6px 9px;font-size:13px}
  .chat-note{font-size:10px;margin-top:4px}
}


/* ---------- Firebase chat ---------- */
.chat{margin:18px 0 4px;padding:12px 12px 10px;background:#fffdf6;border:2px solid #33322f;border-radius:6px;box-shadow:2px 2px 0 #33322f}
.chat h2{font:700 18px "Zen Kaku Gothic New",sans-serif;margin:0 0 8px}
.chat-log{height:180px;overflow-y:auto;border:1px solid #0003;background:#fff; padding:7px}
.chat-empty{color:#777;font-size:13px;padding:20px 4px;text-align:center}
.chat-msg{margin:5px 0;font-size:14px;line-height:20px;overflow-wrap:anywhere}
.chat-msg .chat-name{font-weight:700;margin-right:6px}
.chat-msg .chat-time{color:#999;font-size:11px;margin-left:5px}
.chat-form{display:flex;gap:6px;margin-top:7px}
.chat-form input{flex:1;width:auto!important;margin:0!important;font:500 15px "Zen Kaku Gothic New",sans-serif!important;padding:7px 8px!important}
.chat-form button{margin:0;padding:7px 12px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.chat-note{font-size:11px;color:#777;margin-top:5px}
</style>
</head>
<body>
<main class="pad">

<section id="s-home">
  <h1>数字じゃんけん</h1>
  <p class="sub">1〜100の数字で順位を決めよう。</p>
  <label for="name">ニックネーム</label>
  <input id="name" type="text" maxlength="10" placeholder="なまえ">
  <button id="btn-create">部屋をつくる</button>
  <hr style="border:0;border-top:1px dashed #0004;margin:14px 0">
  <label for="code">部屋番号（英数字5桁）</label>
  <input id="code" type="text" maxlength="5" placeholder="A1B2C" autocapitalize="characters" autocomplete="off">
  <button id="btn-join" class="ghost">部屋に入る</button>
  <div class="msg" id="msg-home" role="alert"></div>
  <details style="font-size:13px;line-height:22px;margin-top:10px"><summary>ルール</summary>
   全員が同時に1〜100の整数を出します。合計が「50×人数」以上なら小さい数字の順、未満なら大きい数字の順で順位がつきます。その順位と数字から得点を計算し、これを10ラウンド行って累計得点で最終順位を決めます。</details>
</section>

<section id="s-lobby" class="hide">
  <p class="sub" style="margin:0">部屋番号（友だちに伝えよう）</p>
  <div class="code" id="room-code"></div>
  <p class="sub" style="margin:0" id="count"></p>
  <ul class="names" id="names"></ul>
  <button id="btn-start" class="hide">ゲーム開始</button>
  <p class="sub hide" id="wait-host">ホストの開始を待っています…</p>
  <button id="btn-leave" class="ghost">退出</button>
  <div id="chat-lobby"></div>
</section>

<section id="s-play" class="hide">
  <p class="sub" style="margin:0">1〜100の数字を決めよう</p>
  <div class="big" id="timer">10</div>
  <div class="bar"><i id="bar"></i></div>
  <input id="num" class="num-in" type="number" min="1" max="100" value="50" inputmode="numeric" aria-label="あなたの数字">
  <input id="rng" type="range" min="1" max="100" value="50" aria-label="スライダー">
  <button id="btn-lock">この数字で決定</button>
  <p class="sub" id="locked"></p>
  <div id="chat-play"></div>
</section>

<section id="s-result" class="hide">
  <h1>開票</h1>
  <div id="rows"></div>
  <div class="calc" id="calc"></div>
  <div id="ranks"></div>
  <button id="btn-again" class="hide">もう一度あそぶ</button>
  <p class="sub hide" id="wait-again">ホストが次を準備中…</p>
  <button id="btn-out" class="ghost">退出</button>
  <div id="chat-result"></div>
</section>
</main>

<div id="banner" class="hide" role="status"><span id="banner-t"></span><button id="btn-cancel" class="ghost">中止</button></div>
<div id="ov" class="hide"><div class="ring" id="ring">
  <svg viewBox="0 0 240 240"><circle class="bg" cx="120" cy="120" r="110"/><circle class="fg" cx="120" cy="120" r="110"/></svg>
  <span>集計完了</span></div></div>


<script>
/* =========================================================
   数字じゃんけん - Firebase版
   Firebase Consoleで「匿名ログイン」と「Realtime Database」を有効にしてください。
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBeHNKc72PDKsj1A3IUp36LsOdKHyst3Uc",
  authDomain: "numjan.firebaseapp.com",
  databaseURL: "https://numjan-default-rtdb.firebaseio.com",
  projectId: "numjan",
  storageBucket: "numjan.firebasestorage.app",
  messagingSenderId: "835473531921",
  appId: "1:835473531921:web:603826cf3121a7fccefdb0"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=v=>Math.max(1,Math.min(100,Math.round(+v)||1));
const CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const rndCode=()=>Array.from({length:5},()=>CH[Math.random()*CH.length|0]).join("");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime=ts=>new Date(ts||Date.now()).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
const err=t=>$("msg-home").textContent=t||"";
const banner=t=>{$("banner").classList.toggle("hide",!t);$("banner-t").textContent=t||""};
const show=id=>["home","lobby","play","result"].forEach(s=>$("s-"+s).classList.toggle("hide",s!==id));

let uid=null,myName="",room="",isHost=false,roomRef=null;
let roomData=null,players={},phase="home",round=0;
const MAX_ROUNDS=10;
let curVal=50,locked=false,timerInt=null,lastShownRound=0;
let chatRef=null,chatListener=null,chatItems=[],wakeLock=null;

function getName(){
  myName=$("name").value.trim().slice(0,10)||"ゲスト"+(Math.random()*90+10|0);
  $("name").value=myName;
  return myName;
}
async function wake(){
  if(wakeLock||!navigator.wakeLock)return;
  try{wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}catch(e){}
}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
function saveSession(){
  try{localStorage.setItem("suujan-firebase-session",JSON.stringify({room,name:myName,ts:Date.now()}))}catch(e){}
}
function clearSession(){try{localStorage.removeItem("suujan-firebase-session")}catch(e){}}

/* ---------- Firebase auth ---------- */
auth.onAuthStateChanged(async user=>{
  if(user){uid=user.uid;await checkSavedSession()}
});
auth.signInAnonymously().catch(e=>{
  console.error(e);
  err("Firebaseに接続できません。Firebaseの「匿名ログイン」を確認してください。");
});

/* ---------- Room helpers ---------- */
function roomPath(code){return db.ref("rooms/"+code)}
function playerPath(code,id){return roomPath(code).child("players/"+id)}
function submissionPath(code,id){return roomPath(code).child("submissions/"+id)}

async function createRoom(){
  if(!uid){err("接続準備中です。少し待ってください。");return}
  getName();err("");banner("部屋を作成中…");
  try{
    let code="",ref=null;
    for(let i=0;i<10;i++){
      const c=rndCode(),r=roomPath(c),snap=await r.once("value");
      if(!snap.exists()){code=c;ref=r;break}
    }
    if(!ref)throw new Error("code-exhausted");
    room=code;roomRef=ref;isHost=true;phase="lobby";round=0;
    await ref.set({
      hostId:uid,
      phase:"lobby",
      round:0,
      createdAt:firebase.database.ServerValue.TIMESTAMP,
      players:{[uid]:{
        name:myName,online:true,score:0,joinedAt:firebase.database.ServerValue.TIMESTAMP
      }}
    });
    await setupPresence();
    listenRoom();
    startChatListener();
    saveSession();
    banner("");
    show("lobby");
    wake();
  }catch(e){
    console.error(e);banner("");err("部屋を作れませんでした。Firebaseの設定・Databaseルールを確認してください。");
  }
}

async function joinRoom(){
  if(!uid){err("接続準備中です。少し待ってください。");return}
  getName();err("");
  const code=$("code").value.trim().toUpperCase();
  if(!/^[A-Z0-9]{5}$/.test(code)){err("部屋番号は英数字5桁で入力してください。");return}
  banner("部屋に接続中…");
  try{
    const ref=roomPath(code),snap=await ref.once("value");
    if(!snap.exists()){banner("");err("その部屋は見つかりません。");return}
    const data=snap.val()||{};
    const list=data.players||{};
    if(Object.keys(list).length>=30&&!list[uid]){
      banner("");err("満員です。");return
    }
    room=code;roomRef=ref;isHost=data.hostId===uid;phase=data.phase||"lobby";round=data.round||0;
    const existingPlayer=list[uid]||{};
    await playerPath(room,uid).update({
      name:myName,online:true,joinedAt:firebase.database.ServerValue.TIMESTAMP,
      score:typeof existingPlayer.score==="number"?existingPlayer.score:0
    });
    await setupPresence();
    listenRoom();
    startChatListener();
    saveSession();
    banner("");
    show(phase==="lobby"?"lobby":phase==="play"?"play":"result");
    if(phase==="play")renderPlayState();
    wake();
  }catch(e){
    console.error(e);banner("");err("部屋に入れませんでした。FirebaseのDatabaseルールを確認してください。");
  }
}

async function setupPresence(){
  if(!roomRef||!uid)return;
  const connected=db.ref(".info/connected");
  connected.on("value",snap=>{
    if(snap.val()!==true||!roomRef)return;
    const p=playerPath(room,uid);
    p.onDisconnect().update({online:false});
    p.update({online:true});
  });
}

function listenRoom(){
  if(!roomRef)return;
  roomRef.off("value");
  roomRef.on("value",snap=>{
    if(!snap.exists()){leave("部屋が終了しました。");return}
    roomData=snap.val()||{};
    players=roomData.players||{};
    phase=roomData.phase||"lobby";
    round=roomData.round||0;
    isHost=roomData.hostId===uid;
    updateHostUI();
    handleRoomState();
  });
}

function updateHostUI(){
  $("btn-start").classList.toggle("hide",!isHost);
  $("wait-host").classList.toggle("hide",isHost);
  $("btn-again").classList.toggle("hide",!isHost);
  if(isHost)$("wait-again").classList.add("hide");
}

function handleRoomState(){
  if(!roomData)return;
  if(phase==="lobby"){
    renderLobby();
    renderChatForCurrentScreen();
  }else if(phase==="play"){
    renderPlayState();
    renderChatForCurrentScreen();
    maybeFinishExpiredRound();
  }else if(phase==="result"&&roomData.result){
    renderChatForCurrentScreen();
    if(lastShownRound!==round){
      lastShownRound=round;
      reveal(roomData.result);
    }
  }
}

function renderLobby(){
  $("room-code").textContent=room;
  const list=Object.values(players);
  $("count").textContent="参加者 "+list.length+"人";
  $("names").innerHTML=list.map(p=>"<li>✎ "+esc(p.name||"ゲスト")+(p.online===false?"（離席中）":"")+"</li>").join("");
  $("btn-start").disabled=list.length<2;
  show("lobby");
}

async function startGame(){
  if(!isHost||!roomRef)return;
  const snap=await roomRef.once("value"),d=snap.val()||{};
  if(d.phase!=="lobby"||((d.round||0)>=MAX_ROUNDS))return;
  if(Object.keys(d.players||{}).length<2)return;
  const nextRound=(d.round||0)+1;
  await roomRef.transaction(current=>{
    if(!current||current.phase!=="lobby")return;
    return {
      ...current,
      phase:"play",
      round:nextRound,
      deadline:Date.now()+10000,
      submissions:null,
      result:null
    };
  });
}

function renderPlayState(){
  show("play");
  const deadline=roomData.deadline||Date.now();
  const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  $("timer").textContent=left;
  $("bar").style.transition="none";
  $("bar").style.transform="scaleX("+Math.max(0,(deadline-Date.now())/10000)+")";
  requestAnimationFrame(()=>{
    $("bar").style.transition="transform 0.2s linear";
    $("bar").style.transform="scaleX(0)";
  });
  if(!locked){
    $("btn-lock").disabled=false;
    $("locked").textContent="";
  }
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    const l=Math.max(0,Math.ceil((deadline-Date.now())/1000));
    $("timer").textContent=l;
    if(l<=0){
      clearInterval(timerInt);
      if(!locked)submit();
      maybeFinishExpiredRound();
    }
  },200);
}

async function submit(){
  if(locked||!roomRef||phase!=="play")return;
  locked=true;
  const n=clamp(curVal);
  $("locked").textContent="決定："+n+"　他の人を待っています…";
  $("btn-lock").disabled=true;
  try{
    await submissionPath(room,uid).set(n);
    await checkRoundComplete();
  }catch(e){
    console.error(e);
    $("locked").textContent="送信に失敗しました。";
  }
}

async function checkRoundComplete(){
  const snap=await roomRef.once("value"),d=snap.val()||{};
  if(d.phase!=="play")return;
  const ps=d.players||{},subs=d.submissions||{};
  const ids=Object.keys(ps);
  if(ids.length&&ids.every(id=>subs[id]!=null)){
    await finishRoundIfNeeded();
  }
}

async function maybeFinishExpiredRound(){
  if(!roomRef||phase!=="play")return;
  if(Date.now()<(roomData.deadline||0))return;
  await finishRoundIfNeeded();
}

async function finishRoundIfNeeded(){
  if(!roomRef)return;
  const snap=await roomRef.once("value"),d=snap.val()||{};
  if(d.phase!=="play")return;
  const ps=d.players||{},subs=d.submissions||{};
  const ids=Object.keys(ps);
  const expired=Date.now()>=(d.deadline||0);
  if(!expired&&!ids.every(id=>subs[id]!=null))return;

  const entries=ids.map(id=>({
    id,name:ps[id].name||"ゲスト",
    n:subs[id]!=null?clamp(subs[id]):50
  }));
  const sum=entries.reduce((a,e)=>a+e.n,0);
  const thr=50*entries.length;
  const asc=sum>=thr;

  // このラウンドの順位を先に確定する。同じ数字は同順位。
  entries.forEach(e=>e.rank=1+entries.filter(o=>asc?o.n<e.n:o.n>e.n).length);

  // 得点 = [ 10 * |x-50|^0.35 / √y ]（ガウス記号＝床関数）
  entries.forEach(e=>{
    e.score=Math.floor(10*Math.pow(Math.abs(e.n-50),0.35)/Math.sqrt(e.rank));
    e.total=(typeof ps[e.id].score==="number"?ps[e.id].score:0)+e.score;
  });

  const finalRound=d.round>=MAX_ROUNDS;
  const finalSorted=[...entries].sort((a,b)=>b.total-a.total);
  finalSorted.forEach((e,i)=>{
    const previous=finalSorted[i-1];
    e.finalRank=(previous&&previous.total===e.total)?previous.finalRank:i+1;
  });

  const result={
    entries:entries.map(({id,name,n,rank,score,total,finalRank})=>({id,name,n,rank,score,total,finalRank})),
    sum,thr,asc,round:d.round,final:finalRound
  };

  await roomRef.transaction(current=>{
    if(!current||current.phase!=="play")return;
    const updatedPlayers={...(current.players||{})};
    for(const e of result.entries){
      if(updatedPlayers[e.id]) updatedPlayers[e.id]={...updatedPlayers[e.id],score:e.total};
    }
    return {...current,players:updatedPlayers,phase:"result",result};
  });
}
async function again(){
  if(!isHost||!roomRef||round>=MAX_ROUNDS)return;
  await roomRef.transaction(current=>{
    if(!current||current.phase!=="result"||current.round>=MAX_ROUNDS)return;
    return {...current,phase:"lobby",deadline:null,submissions:null,result:null};
  });
  locked=false;
  $("btn-again").classList.add("hide");
}

/* ---------- Chat ---------- */
function chatHTML(){
  return `<div class="chat">
    <h2>💬 ひとことチャット</h2>
    <div class="chat-log"><div class="chat-empty">まだメッセージはありません。</div></div>
    <form class="chat-form">
      <input type="text" maxlength="120" placeholder="メッセージを書く…" autocomplete="off">
      <button type="submit">送信</button>
    </form>
    <div class="chat-note">この部屋の参加者だけが見られます。</div>
  </div>`;
}
function buildChat(id){
  const el=$(id);if(!el)return;
  // すでにチャット欄がある場合は作り直さない（受信済みメッセージを消さない）
  if(!el.querySelector(".chat")) el.innerHTML=chatHTML();
  const form=el.querySelector(".chat-form"),input=el.querySelector("input");
  form.onsubmit=async e=>{
    e.preventDefault();
    const text=input.value.trim();
    if(!text||!roomRef)return;
    input.value="";
    try{
      await roomRef.child("chat").push({
        uid,name:myName,text:text.slice(0,120),ts:firebase.database.ServerValue.TIMESTAMP
      });
    }catch(err2){console.error(err2);input.value=text}
  };
}
function startChatListener(){
  if(!roomRef)return;
  if(chatListener&&chatRef)chatRef.off("value",chatListener);

  // 先にチャットUIを1回だけ作る
  buildChat("chat-lobby");
  buildChat("chat-play");
  buildChat("chat-result");

  chatRef=roomRef.child("chat").limitToLast(80);
  chatListener=snap=>{
    chatItems=[];
    snap.forEach(c=>{
      const v=c.val();
      if(v)chatItems.push(v);
    });
    renderChatLogs(chatItems);
  };
  chatRef.on("value",chatListener,err=>{
    console.error("chat read error:",err);
  });
}
function renderChatLogs(items){
  ["chat-lobby","chat-play","chat-result"].forEach(id=>{
    const root=$(id);if(!root)return;
    const log=root.querySelector(".chat-log");if(!log)return;
    if(!items.length){
      log.innerHTML='<div class="chat-empty">まだメッセージはありません。</div>';return;
    }
    log.innerHTML=items.map(x=>`<div class="chat-msg">
      <span class="chat-name">${esc(x.name||"ゲスト")}</span>
      <span>${esc(x.text||"")}</span>
      <span class="chat-time">${fmtTime(x.ts)}</span>
    </div>`).join("");
    log.scrollTop=log.scrollHeight;
  });
}
function renderChatForCurrentScreen(){
  // ルーム情報が更新されてもチャット欄を作り直さない
  buildChat("chat-lobby");
  buildChat("chat-play");
  buildChat("chat-result");
  renderChatLogs(chatItems);
}

/* ---------- Result ---------- */
async function reveal(m){
  clearInterval(timerInt);
  const ring=$("ring");
  ring.classList.remove("go");$("ov").classList.remove("hide");
  void ring.offsetWidth;ring.classList.add("go");
  await sleep(3200);$("ov").classList.add("hide");
  show("result");
  const rows=$("rows"),calc=$("calc"),ranks=$("ranks");
  rows.innerHTML="";ranks.innerHTML="";calc.className="calc";
  $("btn-again").classList.add("hide");$("wait-again").classList.add("hide");
  m.entries.forEach(e=>{
    const d=document.createElement("div");d.className="row";
    d.innerHTML="<span>"+esc(e.name)+"<span class='scoreline'>今回："+e.score+"点　累計："+e.total+"点</span></span><span class='n'>"+e.n+"<span class='pen'>✏️</span></span>";
    rows.appendChild(d);
  });
  await sleep(500);
  for(const d of rows.children){
    d.querySelector(".n").classList.add("write");await sleep(1000);
  }
  const sym=m.sum>m.thr?"＞":m.sum<m.thr?"＜":"＝";
  calc.innerHTML="第"+m.round+"ラウンド　"+m.sum+" "+sym+" "+m.thr+
    "<small>合計 "+sym+" 50×"+m.entries.length+"人　→　"+(m.asc?"小さい数字が上位":"大きい数字が上位")+"<br>この回の得点と累計得点を表示しています</small>";
  calc.classList.add("show");await sleep(1800);

  if(m.final){
    const finalSorted=[...m.entries].sort((a,b)=>b.total-a.total);
    finalSorted.forEach(e=>{
      const tie=finalSorted.filter(o=>o.finalRank===e.finalRank).length>1;
      const d=document.createElement("div");
      d.className="rank"+(tie?" tie":"")+(e.finalRank===1?" first":"")+(e.id===uid?" me":"");
      d.innerHTML="<b>最終"+e.finalRank+"位</b><span>"+esc(e.name)+"　"+e.total+"点</span>";
      ranks.appendChild(d);
    });
    for(const d of ranks.children){d.classList.add("show");await sleep(450)}
    $("wait-again").textContent="10ラウンド終了！これが最終順位です。";
    $("wait-again").classList.remove("hide");
  }else{
    const sorted=[...m.entries].sort((a,b)=>a.rank-b.rank);
    sorted.forEach(e=>{
      const tie=sorted.filter(o=>o.rank===e.rank).length>1;
      const d=document.createElement("div");
      d.className="rank"+(tie?" tie":"")+(e.rank===1?" first":"")+(e.id===uid?" me":"");
      d.innerHTML="<b>"+e.rank+"位</b><span>"+esc(e.name)+"　"+e.n+"　"+e.score+"点</span>";
      ranks.appendChild(d);
    });
    for(const d of ranks.children){d.classList.add("show");await sleep(450)}
    $("btn-again").classList.toggle("hide",!isHost);
    $("wait-again").classList.toggle("hide",isHost);
    if(isHost)$("btn-again").textContent="次のラウンドへ（"+m.round+"/"+MAX_ROUNDS+"）";
    else $("wait-again").textContent="ホストが次のラウンドを準備中…（"+m.round+"/"+MAX_ROUNDS+"）";
  }
  buildChat("chat-result");
}
/* ---------- Leave / session ---------- */
async function leave(msg=""){
  clearInterval(timerInt);releaseWake();
  try{
    if(roomRef&&uid)await playerPath(room,uid).update({online:false});
  }catch(e){}
  if(chatListener&&chatRef)try{chatRef.off("value",chatListener)}catch(e){}
  if(roomRef)try{roomRef.off("value")}catch(e){}
  roomRef=null;roomData=null;chatRef=null;chatListener=null;
  room="";phase="home";isHost=false;locked=false;players={};
  clearSession();show("home");err(msg);
}
async function checkSavedSession(){
  try{
    const s=JSON.parse(localStorage.getItem("suujan-firebase-session"));
    if(!s||Date.now()-s.ts>10*60*1000)return;
    // 自動復帰はせず、入力欄だけ復元する。意図しない部屋参加を防ぐ。
    $("name").value=s.name||"";
  }catch(e){}
}

/* ---------- Events ---------- */
$("btn-create").onclick=createRoom;
$("btn-join").onclick=joinRoom;
$("btn-start").onclick=startGame;
$("btn-again").onclick=again;
$("btn-leave").onclick=()=>leave();
$("btn-out").onclick=()=>leave();
$("btn-cancel").onclick=()=>leave();
$("btn-lock").onclick=submit;

$("code").addEventListener("input",e=>{
  e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
});
$("num").oninput=e=>{
  curVal=e.target.value;
  if(curVal!=="")$("rng").value=clamp(curVal);
};
$("num").onblur=e=>{
  curVal=clamp(e.target.value);e.target.value=curVal;
};
$("rng").oninput=e=>{
  curVal=e.target.value;$("num").value=curVal;
};

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&room)wake();
});
window.addEventListener("beforeunload",()=>{
  if(room&&uid)try{playerPath(room,uid).update({online:false})}catch(e){}
});
</script>
